<div
  style="position: fixed; inset: 0; z-index: 9999;
         background: rgba(0,0,0,0.5);
         backdrop-filter: blur(4px);
         display: flex; align-items: center;
         justify-content: center; padding: 1rem;"
  (click)="onClose()"
>
  <div class="w-full max-w-lg overflow-hidden rounded-2xl bg-white shadow-2xl" (click)="$event.stopPropagation()">
    <!-- Header -->
    <div class="flex items-center justify-between border-b border-gray-100 px-6 py-4">
      <div>
        <h2 class="font-semibold text-gray-900">Dove si trova il problema?</h2>
        <p class="text-sm text-gray-500">Seleziona la zona del campus</p>
      </div>
      <button type="button" class="text-gray-400 transition hover:text-gray-600" (click)="onClose()">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="max-h-[70vh] overflow-y-auto px-6 py-5">
      <div class="space-y-2">
        <div
          *ngFor="let zona of zone"
          (click)="onSeleziona(zona)"
          class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-100 p-3 transition-all hover:border-[#1F4E79] hover:bg-blue-50"
        >
          <span class="h-4 w-4 flex-shrink-0 rounded-sm" [style.background]="zona.colore"></span>
          <span class="text-sm font-medium text-gray-900">{{ zona.nome }}</span>
          <span class="ml-auto text-xs text-gray-400">{{ zona.cubi.length }} cubi</span>
        </div>
      </div>
    </div>
  </div>
</div>
