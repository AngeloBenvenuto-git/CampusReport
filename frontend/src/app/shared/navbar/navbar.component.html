<nav class="sticky top-0 z-[9999] flex h-16 items-center justify-between border-b border-gray-200 bg-white px-4 sm:px-6">
  <a routerLink="/map" class="flex items-center gap-2 text-primary-600">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M4 21V8l8-5 8 5v13M9 21v-6h6v6M9 12h.01M15 12h.01M9 15h.01M15 15h.01" />
    </svg>
    <span class="text-lg font-bold">CampusReport</span>
  </a>

  <div class="hidden items-center gap-6 md:flex" *ngIf="isLoggedIn">
    <ng-container [ngSwitch]="true">
      <ng-container *ngSwitchCase="isAdmin">
        <a routerLink="/admin" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z" />
          </svg>
          Dashboard
        </a>
        <a routerLink="/admin/tecnici" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-1a4 4 0 0 0-3-3.87M9 20H4v-1a4 4 0 0 1 3-3.87m5-1.13a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm6-2a4 4 0 1 0-1.32-7.77M7 8.23A4 4 0 1 0 5.68 16" />
          </svg>
          Tecnici
        </a>
        <a routerLink="/admin/tickets" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
          </svg>
          Tutti i ticket
        </a>
        <a routerLink="/admin/config" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.4-3a7.4 7.4 0 0 1-.13 1.36l2.1 1.64-2 3.46-2.48-1a7.6 7.6 0 0 1-2.36 1.36L14.1 21H9.9l-.43-2.18a7.6 7.6 0 0 1-2.36-1.36l-2.48 1-2-3.46 2.1-1.64a7.4 7.4 0 0 1 0-2.72l-2.1-1.64 2-3.46 2.48 1a7.6 7.6 0 0 1 2.36-1.36L9.9 3h4.2l.43 2.18a7.6 7.6 0 0 1 2.36 1.36l2.48-1 2 3.46-2.1 1.64c.09.44.13.9.13 1.36Z" />
          </svg>
          Configurazione
        </a>
      </ng-container>
      <ng-container *ngSwitchCase="isTecnico">
        <a routerLink="/dashboard" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10Zm0 8h8v-6H3v6Zm10 0h8V11h-8v10Zm0-18v6h8V3h-8Z" />
          </svg>
          Dashboard
        </a>
        <a routerLink="/map" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20 3 17V4l6 3m0 13 6-3m-6 3V7m6 10 6 3V7l-6-3m0 13V4m0 3-6-3" />
          </svg>
          La mia mappa
        </a>
      </ng-container>
      <ng-container *ngSwitchDefault>
        <a routerLink="/map" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 20 3 17V4l6 3m0 13 6-3m-6 3V7m6 10 6 3V7l-6-3m0 13V4m0 3-6-3" />
          </svg>
          Mappa
        </a>
        <a routerLink="/tickets" class="flex items-center gap-1.5 text-sm font-medium text-gray-600 transition hover:text-primary-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
          </svg>
          Le mie segnalazioni
        </a>
      </ng-container>
    </ng-container>
  </div>

  <div class="relative" *ngIf="isLoggedIn">
    <button
      type="button"
      (click)="toggleMenu()"
      class="flex h-10 w-10 items-center justify-center rounded-full bg-primary-600 text-sm font-semibold text-white transition hover:bg-primary-700"
    >
      {{ iniziali }}
    </button>

    <div
      *ngIf="menuAperto"
      class="absolute right-0 z-[9999] mt-2 w-48 rounded-lg border border-gray-200 bg-white py-1 shadow-lg"
      (mouseleave)="chiudiMenu()"
    >
      <div class="border-b border-gray-100 px-4 py-2 text-sm text-gray-500">
        {{ utente?.nome }} {{ utente?.cognome }}
      </div>
      <a routerLink="/tickets" (click)="chiudiMenu()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
        Il mio profilo
      </a>
      <button
        type="button"
        (click)="logout()"
        class="block w-full px-4 py-2 text-left text-sm text-red-600 hover:bg-gray-50"
      >
        Esci
      </button>
    </div>
  </div>
</nav>
