services:
  postgres:
    image: postgres:15
    container_name: campusreport-postgres
    restart: always
    environment:
      POSTGRES_DB: campusreport_db
      POSTGRES_USER: campusreport
      POSTGRES_PASSWORD: campusreport
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusreport"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: campusreport-mailhog
    restart: always
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: campusreport-nlp
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./nlp-service/.env.example
    volumes:
      - nlp_models:/root/.cache/huggingface

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusreport-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/campusreport_db
      DB_USERNAME: campusreport
      DB_PASSWORD: campusreport
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-this-must-be-at-least-256-bits-long}
      NLP_SERVICE_URL: http://nlp-service:8000
      UPLOADS_PATH: /uploads
      EMAIL_FROM: ${EMAIL_FROM:-noreply@campusreport.unical.it}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    volumes:
      - uploads_data:/uploads
    depends_on:
      postgres:
        condition: service_healthy
      nlp-service:
        condition: service_started

volumes:
  postgres_data:
  uploads_data:
  nlp_models:
